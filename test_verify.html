<!DOCTYPE html>
<html>
<head></head>
<body>
<iframe id="f" src="index.html" style="width:500px;height:800px;"></iframe>
<script>
window.addEventListener('message', e => console.log(e.data));
const f = document.getElementById('f');
f.onload = () => {
  setTimeout(() => {
    const doc = f.contentDocument;
    const win = f.contentWindow;
    const btnCreator = doc.getElementById('btn-to-creator');
    const landing = doc.getElementById('screen-landing');
    const creator = doc.getElementById('screen-creator');
    
    const beforeLandingDisp = win.getComputedStyle(landing).display;
    const beforeCreatorDisp = win.getComputedStyle(creator).display;
    
    btnCreator.click();
    
    const afterLandingDisp = win.getComputedStyle(landing).display;
    const afterCreatorDisp = win.getComputedStyle(creator).display;
    
    document.title = `VERIFY_RESULT: beforeL=${beforeLandingDisp}, beforeC=${beforeCreatorDisp}, afterL=${afterLandingDisp}, afterC=${afterCreatorDisp}`;
  }, 200);
};
</script>
</body>
</html>
