<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Avatar V2 Mini Creator — Terrible Little Lives</title>
  <style>
    :root { color-scheme: dark; --ink:#eee9df; --muted:#96929b; --panel:#17181e; --line:#2b2c34; --red:#a5212a; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; background:radial-gradient(circle at 50% 0,#18151c 0,#08090c 55%); color:var(--ink); font-family:Inter,system-ui,sans-serif; }
    button { font:inherit; }
    .shell { width:min(1080px,100%); margin:auto; padding:28px 18px 60px; }
    header { display:flex; align-items:end; justify-content:space-between; gap:20px; margin-bottom:22px; }
    h1,h2 { font-family:Georgia,serif; letter-spacing:.08em; margin:0; }
    h1 { font-size:clamp(1.5rem,4vw,2.4rem); }
    header p { color:var(--muted); margin:.55rem 0 0; }
    .creator { display:grid; grid-template-columns:minmax(280px,430px) 1fr; gap:22px; align-items:start; }
    .preview,.controls,.gallery { background:rgba(23,24,30,.94); border:1px solid var(--line); border-radius:24px; box-shadow:0 22px 60px rgba(0,0,0,.34); }
    .preview { padding:16px; position:sticky; top:18px; }
    .portrait { aspect-ratio:1; width:100%; }
    .portrait svg { display:block; width:100%; height:100%; }
    .random { width:100%; margin-top:12px; border:1px solid #702129; background:linear-gradient(135deg,#a5212a,#741821); color:white; border-radius:14px; padding:13px 16px; font-family:Georgia,serif; font-weight:700; letter-spacing:.08em; cursor:pointer; }
    .controls { padding:20px; display:grid; gap:18px; }
    fieldset { border:0; padding:0; margin:0; }
    legend { color:#c9bfae; font:700 .72rem/1.2 ui-monospace,monospace; text-transform:uppercase; letter-spacing:.12em; margin-bottom:9px; }
    .choices { display:flex; flex-wrap:wrap; gap:8px; }
    .choice { border:1px solid var(--line); background:#101116; color:#aaa6ae; border-radius:999px; padding:8px 11px; cursor:pointer; transition:.16s ease; }
    .choice:hover { color:white; border-color:#5a4c50; }
    .choice.active { color:white; background:#352027; border-color:#9f3942; box-shadow:0 0 0 2px rgba(165,33,42,.12); }
    .swatch { display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:7px; vertical-align:-1px; border:1px solid rgba(255,255,255,.25); }
    .gallery { margin-top:22px; padding:20px; }
    .gallery-head { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:14px; }
    .gallery-head button { color:#ddd5ca; background:#23242b; border:1px solid #393a43; border-radius:10px; padding:8px 11px; cursor:pointer; }
    .grid { display:grid; grid-template-columns:repeat(6,1fr); gap:12px; }
    .mini { aspect-ratio:1; border-radius:15px; overflow:hidden; background:#0c0d11; border:1px solid #30313a; }
    .mini svg { width:100%; height:100%; display:block; }
    @media(max-width:760px){ .creator{grid-template-columns:1fr}.preview{position:static}.grid{grid-template-columns:repeat(3,1fr)} }
  </style>
</head>
<body>
  <main class="shell">
    <header><div><h1>SOUL PORTRAIT LAB</h1><p>Avatar V2 miniature production slice.</p></div></header>
    <section class="creator">
      <div class="preview"><div id="portrait" class="portrait"></div><button id="random" class="random">RANDOMIZE SOUL</button></div>
      <form id="controls" class="controls"></form>
    </section>
    <section class="gallery"><div class="gallery-head"><div><h2>THE LINEUP</h2><p style="color:var(--muted);margin:.4rem 0 0">Random combinations reveal alignment crimes.</p></div><button id="reroll-grid" type="button">Reroll six</button></div><div id="grid" class="grid"></div></section>
  </main>
  <script src="./avatar-v2-engine.js"></script>
  <script>
    const state = { ...DEFAULT_AVATAR_V2 };
    const controls = document.querySelector('#controls');
    const portrait = document.querySelector('#portrait');
    const grid = document.querySelector('#grid');

    function buildControls() {
      controls.innerHTML = '';
      Object.entries(AVATAR_V2_OPTIONS).forEach(([category, options]) => {
        const fieldset = document.createElement('fieldset');
        const legend = document.createElement('legend');
        legend.textContent = category;
        const choices = document.createElement('div');
        choices.className = 'choices';
        Object.entries(options).forEach(([value, option]) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = `choice ${state[category] === value ? 'active' : ''}`;
          if (option.colors) button.innerHTML = `<span class="swatch" style="background:${option.colors[1]}"></span>${option.label}`;
          else button.textContent = option.label;
          button.addEventListener('click', async () => { state[category] = value; buildControls(); await loadAvatarV2(portrait, state); });
          choices.append(button);
        });
        fieldset.append(legend, choices); controls.append(fieldset);
      });
    }

    async function randomizeMain() { Object.assign(state, randomAvatarV2Config()); buildControls(); await loadAvatarV2(portrait, state); }
    async function buildGrid() {
      grid.innerHTML = '';
      await Promise.all(Array.from({length:6}, async () => {
        const cell = document.createElement('div'); cell.className = 'mini'; grid.append(cell);
        await loadAvatarV2(cell, randomAvatarV2Config());
      }));
    }

    document.querySelector('#random').addEventListener('click', randomizeMain);
    document.querySelector('#reroll-grid').addEventListener('click', buildGrid);
    buildControls(); loadAvatarV2(portrait, state); buildGrid();
  </script>
</body>
</html>
